name: Unity CI Linux Server

on:
  workflow_dispatch:
    inputs:
      projectPath:
        description: Path to the Unity project
        required: true
        default: .
      unityVersion:
        description: Unity version, or auto to read ProjectVersion.txt
        required: true
        default: auto
      runTests:
        description: Run Unity tests before Linux build
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-self-hosted-${{ github.repository }}
  cancel-in-progress: false

env:
  UNITY_PROJECT_PATH: ${{ inputs.projectPath || '.' }}
  UNITY_VERSION: ${{ inputs.unityVersion || 'auto' }}

jobs:
  tests:
    if: ${{ inputs.runTests }}
    name: Unity ${{ matrix.testMode }} tests
    runs-on: [self-hosted, linux, x64, unity-main, build-node, proxmox]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        testMode: [editmode, playmode]
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u)":"$(id -g)" /srv/unity-ci/projects

      - name: Restore self-hosted action cache
        run: sudo /opt/unity-ci/scripts/restore-actions-cache.sh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Run Unity tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: test-results/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} tests
          runAsHostUser: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  build-linux:
    name: Build Linux-Server
    needs: [tests]
    if: ${{ always() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: [self-hosted, linux, x64, unity-main, build-node, proxmox]
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u)":"$(id -g)" /srv/unity-ci/projects

      - name: Restore self-hosted action cache
        run: sudo /opt/unity-ci/scripts/restore-actions-cache.sh

      - name: Ensure NAS mount
        run: |
          if ! mountpoint -q /mnt/storage; then
            sudo systemctl start mnt-storage.mount || sudo systemctl start mnt-storage-retry.service
          fi
          test -d /mnt/storage/UnityBuild

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Free memory before Linux IL2CPP build
        run: |
          docker system prune -af || true
          free -h

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          customParameters: -standaloneBuildSubtarget Server -additionalIl2CppArgs --jobs=6
          buildsPath: build
          runAsHostUser: false
          dockerShmSize: 1025m

      - name: Fix workspace permissions after build
        if: always()
        run: sudo chown -R "$(id -u)":"$(id -g)" /srv/unity-ci/projects

      - name: Publish build to NAS (Z:/UnityBuild)
        if: success()
        run: |
          DEST="/mnt/storage/UnityBuild/Multiplayer-FPS/${{ github.run_number }}/Linux-Server"
          mkdir -p "$DEST"
          rsync -a "build/StandaloneLinux64/" "$DEST/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-Linux-Server
          path: build/StandaloneLinux64
          if-no-files-found: error
