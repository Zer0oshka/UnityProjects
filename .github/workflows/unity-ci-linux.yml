name: Unity CI Linux Server

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: Unity version, or auto to read ProjectVersion.txt
        required: true
        default: auto
      runTests:
        description: Run Unity tests before Linux build
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-self-hosted-${{ github.repository }}
  cancel-in-progress: false

env:
  UNITY_WORKSPACE: /srv/unity-ci/workspace/Multiplayer-FPS
  UNITY_PROJECT_PATH: /srv/unity-ci/workspace/Multiplayer-FPS
  UNITY_VERSION: ${{ inputs.unityVersion || 'auto' }}

jobs:
  tests:
    if: ${{ inputs.runTests }}
    name: Unity ${{ matrix.testMode }} tests
    runs-on: [self-hosted, linux, x64, unity-main, build-node, proxmox]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        testMode: [editmode, playmode]
    steps:
      - name: Restore self-hosted action cache
        run: sudo /opt/unity-ci/scripts/restore-actions-cache.sh

      - name: Sync workspace from LAN mirror
        run: /opt/unity-ci/scripts/sync-workspace.sh ${{ github.sha }} ${{ github.ref_name }}

      - name: Run Unity tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_PATH: /opt/unity-ci/Unity
        run: |
          /opt/unity-ci/scripts/run-unity-tests.sh \
            "${{ env.UNITY_PROJECT_PATH }}" \
            "${{ matrix.testMode }}" \
            "${{ env.UNITY_PROJECT_PATH }}/test-results/${{ matrix.testMode }}"

  build-linux:
    name: Build Linux-Server
    needs: [tests]
    if: ${{ always() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: [self-hosted, linux, x64, unity-main, build-node, proxmox]
    steps:
      - name: Restore self-hosted action cache
        run: sudo /opt/unity-ci/scripts/restore-actions-cache.sh

      - name: Ensure NAS mount
        run: |
          if ! mountpoint -q /mnt/storage; then
            sudo systemctl start mnt-storage.mount || sudo systemctl start mnt-storage-retry.service
          fi
          test -d /mnt/storage/UnityBuild

      - name: Sync workspace from LAN mirror
        run: /opt/unity-ci/scripts/sync-workspace.sh ${{ github.sha }} ${{ github.ref_name }}

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          customParameters: -standaloneBuildSubtarget Server -additionalIl2CppArgs --jobs=6
          buildsPath: build
          providerStrategy: local-system
          localCacheEnabled: true
          localCacheLibrary: true
          skipActivation: false
          runAsHostUser: true

      - name: Publish build to NAS (Z:/UnityBuild)
        if: success()
        run: |
          DEST="/mnt/storage/UnityBuild/Multiplayer-FPS/${{ github.run_number }}/Linux-Server"
          mkdir -p "$DEST"
          rsync -a "${{ env.UNITY_PROJECT_PATH }}/build/StandaloneLinux64/" "$DEST/"
